<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Open Teacher App</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        padding: 16px;
        color: #1f1f1f;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      code {
        background: #f3f2f1;
        padding: 2px 4px;
        border-radius: 4px;
      }
      ol {
        margin: 8px 0 0 18px;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <h1>Launch the Teacher App</h1>
    <p>
      If the Teacher app didn't open automatically, register the Windows protocol
      handler and try again.
    </p>
    <p>
      Protocol tried: <code id="protocol-url">shortanswer://login</code>
    </p>
    <ol>
      <li>Run the provided <code>shortanswer-protocol.reg</code> file.</li>
      <li>Try the ribbon button again.</li>
    </ol>
    <script src="protocol-dialog.js"></script>
  </body>
</html>
