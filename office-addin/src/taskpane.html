<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Short Answer</title>

  <!-- REQUIRED -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <style>
    body {
      font-family: Segoe UI, Arial, sans-serif;
      padding: 16px;
    }
    button {
      background: #0078d4;
      color: white;
      border: none;
      padding: 10px 14px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #005a9e;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #444;
    }
  </style>
</head>

<body>
  <h3>Short Answer</h3>

  <!-- LOGIN BUTTON -->
  <button id="loginBtn">Login</button>

  <div id="status">Not logged in</div>

  <script>
    Office.onReady(() => {
      document.getElementById("loginBtn").onclick = login;
    });

    function login() {
      document.getElementById("status").innerText = "Logging in...";

      // Example (replace with real auth)
      setTimeout(() => {
        document.getElementById("status").innerText = "Logged in successfully ✔";
      }, 1000);
    }
  </script>
</body>
</html>
